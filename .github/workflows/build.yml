name: Build RMX3700 5.10.236 kernel (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '配置变体：gki 或 consolidate'
        required: true
        default: 'gki'
      kabi_patch:
        description: 'SYSVIPC kABI 补丁槽位：6_7_8 / 3_4_5 / 1_2_3'
        required: true
        default: '6_7_8'
      localversion:
        description: 'CONFIG_LOCALVERSION，必须与目标 ROM 内核 release 一致'
        required: true
        default: '-android12-9-o-g74d132f4467a'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /opt/microsoft 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖（重试+镜像回退）
        run: |
          set -e
          ok=0
          for i in 1 2 3 4 5; do
            if sudo apt-get update -qq; then ok=1; break; fi
            echo "apt update 第 $i 次失败，切换官方源重试"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            sleep 15
          done
          [ "$ok" = 1 ] || echo "（apt update 均失败，继续尝试用缓存安装）"
          for i in 1 2 3 4 5; do
            if sudo apt-get install -y -qq --fix-missing bc bison flex libssl-dev libelf-dev \
                 libncurses-dev build-essential cpio rsync zip unzip python3 kmod \
                 dwarves gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu; then
              echo "✅ 依赖安装通过（第 $i 次）"; exit 0
            fi
            echo "apt install 第 $i 次失败，20 秒后重试"
            sleep 20
          done
          echo "❌ apt 安装多次失败"; exit 1

      - name: 获取 clang r416183b
        run: |
          set -e
          mkdir -p "$HOME/clang"
          ok=0
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"; do
            echo "::group::尝试 $url"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tar.gz "$url"; then
              echo "下载成功"; ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
          done
          if [ "$ok" = "1" ]; then
            tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          else
            echo "::warning::googlesource 失败，改用 GitHub 镜像"
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
              /tmp/clangrepo
            cp -r /tmp/clangrepo/. "$HOME/clang"/
            rm -rf "$HOME/clang/.git"
          fi
          export PATH="$HOME/clang/bin:$PATH"
          clang --version | head -2
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          df -h /

      - name: 载入设备真实配置 + 补桩跑通 olddefconfig
        run: |
          set -e
          # realme 公开的树里 kernel/oplus_cpu、kernel/sched/walt/tuning 只是子模块占位
          # （.gitmodules 都没给），但 init/Kconfig 里 source 它们是活的（外面那圈 #ifdef
          # 在 Kconfig 里只是注释）→ defconfig 直接报 can't open file。
          # 做法：反复跑 defconfig，报哪个缺就补个空桩，直到通过。
          for p in kernel/oplus_cpu kernel/sched/walt/tuning; do
            git rm -r -f -q --cached "$p" 2>/dev/null || true
            rm -rf "$p"
          done

          # === v3: 集成 vendor-source 私有子树（2026-11-19）===
          # v2 失败根因：28 个 oplus 私有子树被桩 → 内核缺 ~17MB 内置驱动
          # → vendor 模块符号/CRC 对不上 → 早期崩溃。真源码在 vendor-source 仓库。
          git clone --depth 1 https://github.com/realme-kernel-opensource/realme_GTNeo5SE-AndroidB-vendor-source /tmp/vsrc 2>/dev/null ||           git clone --depth 1 https://github.com/realme-kernel-opensource/realme_GTNeo5SE-AndroidB-vendor-source /tmp/vsrc
          MAP='
          kernel/oplus_cpu/cpufreq_bouncing|vendor/oplus/kernel/cpu/cpufreq_bouncing
          kernel/oplus_cpu/cpufreq_effiency|vendor/oplus/kernel/cpu/cpufreq_effiency
          kernel/oplus_cpu/cpufreq_health|vendor/oplus/kernel/cpu/cpufreq_health
          kernel/oplus_cpu/oplus_omrg|vendor/oplus/kernel/cpu/oplus_omrg
          kernel/oplus_cpu/oplus_overload|vendor/oplus/kernel/cpu/oplus_overload
          kernel/oplus_cpu/sched|vendor/oplus/kernel/cpu/sched
          kernel/oplus_cpu/uad|vendor/oplus/kernel/cpu/uad
          mm/oplus_mm|vendor/oplus/kernel/mm
          drivers/input/touchscreen/oplus_touchscreen_v2|vendor/oplus/kernel/touchpanel/oplus_touchscreen_v2
          drivers/input/touchscreen/synaptics_hbp|vendor/oplus/kernel/touchpanel/synaptics_hbp
          drivers/base/kernelFwUpdate|vendor/oplus/kernel/touchpanel/kernelFwUpdate
          drivers/soc/oplus/boot|vendor/oplus/kernel/boot
          drivers/soc/oplus/device_info|vendor/oplus/kernel/device_info
          drivers/soc/oplus/dfr|vendor/oplus/kernel/dfr
          drivers/soc/oplus/dft|vendor/oplus/kernel/dft
          drivers/soc/oplus/mdmfeature|vendor/oplus/hardware/radio/kernel/mdmfeature
          drivers/soc/oplus/mdmrst|vendor/oplus/hardware/radio/mdmrst
          drivers/soc/oplus/multimedia|vendor/oplus/kernel/multimedia
          drivers/soc/oplus/oplus_consumer_ir|vendor/oplus/sensor/kernel/oplus_consumer_ir
          drivers/soc/oplus/storage|vendor/oplus/kernel/storage
          drivers/soc/oplus/power/midas|vendor/oplus/kernel/power/midas
          drivers/soc/oplus/power/subsys_sleep_monitor|vendor/oplus/kernel/power/subsys_sleep_monitor
          drivers/soc/oplus/power/cpufreq_effiency|vendor/oplus/kernel/power/cpufreq_effiency
          drivers/soc/oplus/power/cpufreq_health|vendor/oplus/kernel/power/cpufreq_health
          drivers/soc/oplus/sensor|vendor/oplus/sensor/kernel
          drivers/misc/oplus_procs_load|vendor/oplus/kernel/power/procs_load
          drivers/input/uff_fp_drivers|vendor/oplus/secure/biometrics/fingerprints/bsp/uff/driver
          drivers/input/oplus_fp_driver|vendor/oplus/secure/biometrics/fingerprints/bsp/drivers_kernel/component3.0/mtk
          '
          echo "$MAP" | while IFS='|' read -r kdst vsrcp; do
            kdst=$(echo "$kdst" | xargs); vsrcp=$(echo "$vsrcp" | xargs)
            [ -n "$kdst" ] || continue
            if [ -d "/tmp/vsrc/$vsrcp" ]; then
              rm -rf "$kdst"
              # 父目录若是同名文件/悬空 symlink（realme 树常见），先清掉
              pd="$(dirname "$kdst")"
              [ -e "$pd" ] && [ ! -d "$pd" ] && rm -f "$pd"
              [ -L "$pd" ] && rm -f "$pd"
              mkdir -p "$pd"
              cp -r "/tmp/vsrc/$vsrcp" "$kdst"
              echo "  集成 $kdst ← $vsrcp ($(find "$kdst" -type f | wc -l) 文件)"
            else
              echo "  ⚠ vendor-source 无 $vsrcp（留待补桩）"
            fi
          done

          mkdir -p out
          # 2026-11-19 改用设备真实配置（RisingOS 9 运行中 /proc/config.gz 提取）：
          # gki_defconfig 缺全部 oplus/qcom 设备内置功能（48MB vs 30.5MB）→ 上次 CI 内核无法开机
          cp configs/rmx3700_stock.config out/.config
          attempt=0
          while : ; do
            attempt=$((attempt+1))
            if make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 olddefconfig > /tmp/defconfig.log 2>&1; then
              echo "✅ olddefconfig 通过（第 $attempt 次尝试）"
              break
            fi
            miss=$(sed -n 's/.*can.t open file "\([^"]*\)".*/\1/p' /tmp/defconfig.log | head -1)
            if [ -z "$miss" ] || [ "$attempt" -ge 40 ]; then
              echo "❌ 无法继续补桩，最后一次日志："
              tail -40 /tmp/defconfig.log
              exit 1
            fi
            echo "补桩: $miss"
            d="$(dirname "$miss")"
            # 有些子模块占位会落成同名文件，先清掉
            [ -e "$d" ] && [ ! -d "$d" ] && rm -f "$d" || true
            [ -e "$miss" ] && [ ! -d "$miss" ] && rm -f "$miss" || true
            mkdir -p "$d" 2>/dev/null || true
            : > "$miss" 2>/dev/null || true
            if [ ! -f "$miss" ]; then
              # 实在建不了，就把引用它的 source 行注释掉
              echo "  建桩失败，改注释 source 引用"
              grep -rl "source \"$miss\"" --include='Kconfig*' . 2>/dev/null | while IFS= read -r kf; do
                sed -i "s|^\\([[:space:]]*\\)source \"$miss\"|\\1# source \"$miss\" (missing)|" "$kf"
                echo "  已注释 $kf"
              done
            fi
          done
          echo "共补桩 $((attempt-1)) 个"

      - name: 补齐厂商私有子树缺件
        run: |
          set -e
          # realme 公开树把 OPLUS 私有驱动做成指向 vendor/oplus/... 的 symlink，
          # 仓库不含 vendor/ → checkout 后全部悬空；drivers/soc/Makefile 里还有
          # 无条件 obj-y += oplus/storage/ 等，make 会去找并不存在的 Makefile。
          echo "=== v3: drivers/soc/Makefile 的 oplus 行不再整体注释（真源码已集成）==="
          # 仅注释指向仍缺失目录的行（目录存在且有 Makefile 则保留）
          sed -i -E '/^[[:space:]]*(obj|subdir)-[^=]*[+]=.*oplus\// { \/storage\/|\/sensor\/|\/multimedia\/|\/boot\/|\/dfr\/|\/dft\/|\/device_info\/|\/mdmfeature\/|\/mdmrst\/|\/consumer_ir\/|\/midas\/|\/subsys_sleep_monitor\/|\/cpufreq_effiency\/|\/cpufreq_health\/|\/procs_load\/|\/oplus_touchscreen/! s|^|# vendor stub: | }' drivers/soc/Makefile 2>/dev/null || true
          echo "（未命中的 oplus 行保留，由集成源码提供构建）"
          grep -n 'oplus/' drivers/soc/Makefile | head -20 || true
          echo "=== 通用兜底：被引用但缺 Makefile 的子目录建空桩 ==="
          find . -path ./out -prune -o -path ./.git -prune -o -name Makefile -type f -print > /tmp/mklist
          while IFS= read -r mf; do
            d=$(dirname "$mf")
            grep -E '^[[:space:]]*(obj|subdir)-[^=]*[+]=' "$mf" 2>/dev/null | sed 's/#.*//' | tr ' \t' '\n\n' | grep '/$' | grep -v '\$' | sort -u | while IFS= read -r sub; do
              sub=${sub%/}
              sd="$d/$sub"
              [ -f "$sd/Makefile" ] && continue
              [ -f "$sd/Kbuild" ] && continue
              [ -L "$sd" ] && rm -f "$sd"
              mkdir -p "$sd" 2>/dev/null || continue
              printf '# stub: source missing in public tree\n' > "$sd/Makefile"
              echo "  stub $sd"
            done
          done < /tmp/mklist
          echo "=== 补桩完成 ==="

      - name: 修正开源树源码缺陷
        run: |
          set -e
          # 5.10 的 kvzalloc/kvfree 声明在 include/linux/mm.h，而 realme 改过的
          # drivers/thermal/thermal_sysfs.c 只 include 了 linux/slab.h →
          # implicit declaration 被 -Werror 判为致命错误。
          f=drivers/thermal/thermal_sysfs.c
          if ! grep -q '^#include <linux/mm.h>' "$f"; then
            sed -i 's|^#include <linux/slab.h>$|#include <linux/slab.h>\n#include <linux/mm.h>|' "$f"
          fi
          grep -n 'linux/mm.h\|linux/slab.h' "$f"
          # realme 从较新内核 backport 了 mmget_still_valid() 检查，但本 5.10 树
          # 既无该函数也无 MMF_UNSTABLE；上游 android12-5.10 的 binder_alloc.c
          # 在 mmap_write_lock(mm) 后直接取 vma，没有这段检查。恢复上游逻辑：
          # 删掉这 5 行；err_no_vma / free_range 标签在别处仍有 goto 引用。
          sed -i '/if (!mmget_still_valid(mm)) {/,+4d' drivers/android/binder_alloc.c
          grep -n 'mmget_still_valid' drivers/android/binder_alloc.c || echo "  binder: 已恢复上游 5.10 逻辑"

      - name: 应用 kABI 补丁并提交
        run: |
          set -e
          B=https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12
          curl -fsSL -o /tmp/001.patch "$B/001.GKI-below-6.12-fix_sysvipc_kabi_${{ inputs.kabi_patch }}.patch"
          curl -fsSL -o /tmp/002.patch "$B/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          for p in /tmp/001.patch /tmp/002.patch; do
            echo "::group::应用 $p"
            head -10 "$p"
            if git apply --verbose --recount -p1 "$p"; then
              echo "git apply 成功"
            else
              echo "::warning::git apply 失败，回退 patch --fuzz=3"
              patch -p1 --fuzz=3 < "$p"
            fi
            echo "::endgroup::"
          done
          # 补丁和桩都要提交，否则工作树是脏的，setlocalversion 会在版本串尾部加 "+"
          # realme 开源树笔误：shrink_lruvec() 声明 proportional_reclaim 却使用 scan_adjusted
          sed -i 's/bool proportional_reclaim;/bool scan_adjusted;/' mm/vmscan.c
          grep -n 'bool scan_adjusted' mm/vmscan.c
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: droidspaces kabi patches + stubs" || true
          git status --short | head -5

      - name: 合并 fragment 并对齐版本串
        run: |
          set -e
          echo "基底 = 设备真实配置 configs/rmx3700_stock.config（不经 parrot 片段）"
          cp out/.config /tmp/base.config
          cat > /tmp/droidspaces-extra.fragment <<'FRAG'
          CONFIG_ANDROID_KABI_RESERVE=y
          CONFIG_POSIX_MQUEUE=y
          # 关 SCM 门禁与符号裁剪：vendor 模块加载必需；多导出符号 ABI 安全（RESEARCH.md §5/§6）
          # CONFIG_MODULE_SCMVERSION is not set
          # CONFIG_TRIM_UNUSED_KSYMS is not set
          FRAG
          scripts/kconfig/merge_config.sh -m -O out \
            /tmp/base.config \
            arch/arm64/configs/droidspaces.fragment \
            /tmp/droidspaces-extra.fragment

          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${{ inputs.localversion }}\"|" out/.config
          scripts/config --file out/.config -d LOCALVERSION_AUTO 2>/dev/null || true
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 olddefconfig

          echo "=== 关键项 ==="
          grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|DEVTMPFS_MOUNT|USER_NS|MODVERSIONS|LOCALVERSION|ANDROID_KABI_RESERVE|MODULES|NET)=" out/.config || true
          grep -E "^# CONFIG_(LOCALVERSION_AUTO|CFS_BANDWIDTH|CGROUP_PIDS|MODULE_SCMVERSION|TRIM_UNUSED_KSYMS) " out/.config || true
          cp out/.config /tmp/kernel.config

      - name: 编译 Image
        run: |
          set -o pipefail
          # 5.10 的 scripts/setlocalversion：CONFIG_LOCALVERSION_AUTO=N 时，只要
          # 仓库不在 annotated tag 上就会追加 "+"，CI checkout 必然命中 →
          # vermagic 变成 "...g74d132f4467a+"，与 ROM 原版不一致会让 vendor .ko 拒载。
          # 显式把 LOCALVERSION 设为空即可抑制（空值同样算 "set"），且不影响版本串。
          export LOCALVERSION=
          make -k O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) Image 2>&1 | tee /tmp/build.log | tail -60
          make -k O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) modules 2>&1 | tee /tmp/modules.log | tail -20

      - name: 检查产物
        run: |
          set -e
          ls -lh out/arch/arm64/boot/
          file out/arch/arm64/boot/Image
          VM=$(strings out/arch/arm64/boot/Image | grep -m1 -E "^5\.10\.[0-9]+-.*SMP" || true)
          echo "vermagic: $VM"
          strings out/arch/arm64/boot/Image | grep -m1 -E "^Linux version" || true
          EXPECT="5.10.236${{ inputs.localversion }}"
          if printf '%s' "$VM" | grep -q '+'; then
            echo "❌ vermagic 含 +，与目标 ROM 不一致（检查产物必须干净）"; exit 1
          fi
          case "$VM" in
            "$EXPECT"*) echo "✅ vermagic 与目标 ROM 对齐" ;;
            *) echo "❌ vermagic 不符，期望前缀 $EXPECT"; exit 1 ;;
          esac

      - name: 上传内核
        uses: actions/upload-artifact@v4
        with:
          name: rmx3700-236-${{ inputs.variant }}-${{ inputs.kabi_patch }}
          path: |
            out/arch/arm64/boot/Image
            /tmp/kernel.config
            out/System.map
            out/drivers/net/macvlan.ko
            out/drivers/net/ipvlan/ipvlan.ko
          if-no-files-found: warn
          retention-days: 30

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/build.log
            /tmp/defconfig.log
            /tmp/kernel.config
          if-no-files-found: ignore
          retention-days: 7
