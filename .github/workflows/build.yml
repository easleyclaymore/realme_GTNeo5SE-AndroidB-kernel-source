name: Build RMX3700 5.10.236 kernel (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '配置变体：gki 或 consolidate'
        required: true
        default: 'gki'
      kabi_patch:
        description: 'SYSVIPC kABI 补丁槽位：6_7_8 / 3_4_5 / 1_2_3'
        required: true
        default: '6_7_8'
      localversion:
        description: 'CONFIG_LOCALVERSION，必须与目标 ROM 内核 release 一致'
        required: true
        default: '-android12-9-o-g74d132f4467a'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /opt/microsoft 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            libncurses-dev build-essential cpio rsync zip unzip python3 kmod \
            dwarves gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: 获取 clang r416183b
        run: |
          set -e
          mkdir -p "$HOME/clang"
          ok=0
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"; do
            echo "::group::尝试 $url"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tar.gz "$url"; then
              echo "下载成功"; ok=1; echo "::endgroup::"; break
            fi
            echo "::endgroup::"
          done
          if [ "$ok" = "1" ]; then
            tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          else
            echo "::warning::googlesource 失败，改用 GitHub 镜像"
            git clone --depth=1 \
              https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b \
              /tmp/clangrepo
            cp -r /tmp/clangrepo/. "$HOME/clang"/
            rm -rf "$HOME/clang/.git"
          fi
          export PATH="$HOME/clang/bin:$PATH"
          clang --version | head -2
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          df -h /

      - name: 补桩 + 跑通 gki_defconfig
        run: |
          set -e
          # realme 公开的树里 kernel/oplus_cpu、kernel/sched/walt/tuning 只是子模块占位
          # （.gitmodules 都没给），但 init/Kconfig 里 source 它们是活的（外面那圈 #ifdef
          # 在 Kconfig 里只是注释）→ defconfig 直接报 can't open file。
          # 做法：反复跑 defconfig，报哪个缺就补个空桩，直到通过。
          for p in kernel/oplus_cpu kernel/sched/walt/tuning; do
            git rm -r -f -q --cached "$p" 2>/dev/null || true
            rm -rf "$p"
          done

          mkdir -p out
          attempt=0
          while : ; do
            attempt=$((attempt+1))
            if make O=out ARCH=arm64 LLVM=1 gki_defconfig > /tmp/defconfig.log 2>&1; then
              echo "✅ defconfig 通过（第 $attempt 次尝试）"
              break
            fi
            miss=$(sed -n 's/.*can.t open file "\([^"]*\)".*/\1/p' /tmp/defconfig.log | head -1)
            if [ -z "$miss" ] || [ "$attempt" -ge 40 ]; then
              echo "❌ 无法继续补桩，最后一次日志："
              tail -40 /tmp/defconfig.log
              exit 1
            fi
            echo "补桩: $miss"
            d="$(dirname "$miss")"
            # 有些子模块占位会落成同名文件，先清掉
            [ -e "$d" ] && [ ! -d "$d" ] && rm -f "$d" || true
            [ -e "$miss" ] && [ ! -d "$miss" ] && rm -f "$miss" || true
            mkdir -p "$d" 2>/dev/null || true
            : > "$miss" 2>/dev/null || true
            if [ ! -f "$miss" ]; then
              # 实在建不了，就把引用它的 source 行注释掉
              echo "  建桩失败，改注释 source 引用"
              grep -rl "source \"$miss\"" --include='Kconfig*' . 2>/dev/null | while IFS= read -r kf; do
                sed -i "s|^\\([[:space:]]*\\)source \"$miss\"|\\1# source \"$miss\" (missing)|" "$kf"
                echo "  已注释 $kf"
              done
            fi
          done
          echo "共补桩 $((attempt-1)) 个"

      - name: 应用 kABI 补丁并提交
        run: |
          set -e
          B=https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12
          curl -fsSL -o /tmp/001.patch "$B/001.GKI-below-6.12-fix_sysvipc_kabi_${{ inputs.kabi_patch }}.patch"
          curl -fsSL -o /tmp/002.patch "$B/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          for p in /tmp/001.patch /tmp/002.patch; do
            echo "::group::应用 $p"
            head -10 "$p"
            if git apply --verbose --recount -p1 "$p"; then
              echo "git apply 成功"
            else
              echo "::warning::git apply 失败，回退 patch --fuzz=3"
              patch -p1 --fuzz=3 < "$p"
            fi
            echo "::endgroup::"
          done
          # 补丁和桩都要提交，否则工作树是脏的，setlocalversion 会在版本串尾部加 "+"
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: droidspaces kabi patches + stubs" || true
          git status --short | head -5

      - name: 合并 fragment 并对齐版本串
        run: |
          set -e
          case "${{ inputs.variant }}" in
            gki)         VCONF=arch/arm64/configs/vendor/parrot_GKI.config ;;
            consolidate) VCONF=arch/arm64/configs/vendor/parrot_consolidate.config ;;
            *) echo "未知 variant"; exit 1 ;;
          esac
          echo "variant=${{ inputs.variant }} → $VCONF"
          scripts/kconfig/merge_config.sh -m -O out \
            "$VCONF" \
            arch/arm64/configs/droidspaces.fragment

          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${{ inputs.localversion }}\"|" out/.config
          scripts/config --file out/.config -d LOCALVERSION_AUTO 2>/dev/null || true
          make O=out ARCH=arm64 LLVM=1 olddefconfig

          echo "=== 关键项 ==="
          grep -E "^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|DEVTMPFS_MOUNT|USER_NS|MODVERSIONS|LOCALVERSION)=" out/.config || true
          grep -E "^# CONFIG_(LOCALVERSION_AUTO|CFS_BANDWIDTH|CGROUP_PIDS) " out/.config || true
          cp out/.config /tmp/kernel.config

      - name: 编译 Image
        run: |
          set -o pipefail
          make O=out ARCH=arm64 LLVM=1 -j$(nproc) Image 2>&1 | tee /tmp/build.log | tail -60

      - name: 检查产物
        run: |
          set -e
          ls -lh out/arch/arm64/boot/
          file out/arch/arm64/boot/Image
          VM=$(strings out/arch/arm64/boot/Image | grep -m1 -E "^5\.10\.[0-9]+-.*SMP" || true)
          echo "vermagic: $VM"
          strings out/arch/arm64/boot/Image | grep -m1 -E "^Linux version" || true
          EXPECT="5.10.236${{ inputs.localversion }}"
          case "$VM" in
            "$EXPECT"*) echo "✅ vermagic 与目标 ROM 对齐" ;;
            *) echo "❌ vermagic 不符，期望前缀 $EXPECT"; exit 1 ;;
          esac

      - name: 上传内核
        uses: actions/upload-artifact@v4
        with:
          name: rmx3700-236-${{ inputs.variant }}-${{ inputs.kabi_patch }}
          path: |
            out/arch/arm64/boot/Image
            /tmp/kernel.config
            out/System.map
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: |
            /tmp/build.log
            /tmp/defconfig.log
            /tmp/kernel.config
          if-no-files-found: ignore
          retention-days: 7
